<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه تبریک</title>
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: white;
            color: black;
        }

        /* انیمیشن چرخش پس‌زمینه payam.png */
        @keyframes gold-background-effect {
            0% {
                box-shadow: 0 0 50px 20px rgba(255, 215, 0, 0.7);
                transform: perspective(1000px) rotateY(0deg) scale(1.0);
            }
            50% {
                box-shadow: 0 0 80px 30px rgba(255, 223, 0, 0.9);
                transform: perspective(1000px) rotateY(15deg) scale(1.05);
            }
            100% {
                box-shadow: 0 0 50px 20px rgba(255, 215, 0, 0.7);
                transform: perspective(1000px) rotateY(0deg) scale(1.0);
            }
        }
        
        #payam-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #FFD700, #FFCC00, #FFEB00, #FFF200);
            background-size: 400% 400%;
            animation: gold-background-effect 5s ease infinite alternate;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            position: absolute;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out, visibility 0.5s;
        }
        
        /* انیمیشن‌های پویا و جذاب */
        @keyframes fade-in-scale-up {
            0% { opacity: 0; transform: scale(0.5) translateY(50px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fade-out-down {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(50px); }
        }
        
        @keyframes bounce-in-3d {
            0% { opacity: 0; transform: scale(0.5) rotateX(90deg) translateY(-200px); }
            60% { opacity: 1; transform: scale(1.1) rotateX(-10deg) translateY(0); }
            80% { transform: scale(0.9) rotateX(5deg) translateY(-5px); }
            100% { transform: scale(1) rotateX(0deg) translateY(0); }
        }

        @keyframes shrink-fade-out {
            0% { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(0.5) rotate(180deg); }
        }

        /* استایل تصاویر برای پر کردن صفحه */
        .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
        }

        #klikkon {
            animation: fade-in-scale-up 1s forwards;
            cursor: pointer;
        }
        #klikkon.clicked {
            animation: fade-out-down 0.8s forwards;
        }

        #pakatebaz {
            animation: bounce-in-3d 1s forwards;
        }
        #pakatebaz.shrink-out {
            animation: shrink-fade-out 0.8s forwards;
        }
        
        #payam {
            position: relative;
            z-index: 10;
        }
        
        #payam-container.fade-out-effect {
            animation: fade-out-down 1s forwards;
        }

        /* کانتینر گیف‌ها */
        .gif-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gif {
            position: absolute;
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        #gif1 {
            bottom: 5vh;
            animation: bounce-in-3d 1s forwards;
        }
        
        #gif2, #gif3, #gif4 {
            animation: fade-in-scale-up 1s forwards;
        }

        /* استایل دکمه‌ها */
        #button-container {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            animation: bounce-in-3d 1s forwards;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transition: all 0.3s ease-in-out;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateY(0);
        }
        
        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* انیمیشن کلیک دکمه‌ها */
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .blue-button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: 3px solid #005bb5;
        }
        
        .green-button {
            background: linear-gradient(135deg, #4ef536, #14c718);
            color: white;
            border: 3px solid #0f8e12;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="klikkon-container" class="image-container">
            <img id="klikkon" src="klikkon.png" alt="کلیک کنید">
        </div>
        
        <div id="pakatebaz-container" class="image-container hidden">
            <img id="pakatebaz" src="pakatebaz.png" alt="پاکت باز">
        </div>
        
        <div id="payam-main-container" class="hidden">
            <div id="payam-container">
                <img id="payam" src="payam.png" alt="پیام">
                <div class="gif-container">
                    <img id="gif1" class="hidden gif" src="1.gif" alt="گیف 1">
                    <img id="gif2" class="hidden gif" src="2.gif" alt="گیف 2">
                    <img id="gif3" class="hidden gif" src="3.gif" alt="گیف 3">
                    <img id="gif4" class="hidden gif" src="4.gif" alt="گیف 4">
                </div>
            </div>
        </div>
    </div>
    
    <div id="button-container" class="hidden">
        <button id="restart-btn" class="green-button">شروع مجدد</button>
        <button id="back-to-form-btn" class="blue-button">بازگشت به فرم</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const klikkonContainer = document.getElementById('klikkon-container');
            const klikkonImg = document.getElementById('klikkon');
            const pakatebazContainer = document.getElementById('pakatebaz-container');
            const pakatebazImg = document.getElementById('pakatebaz');
            const payamMainContainer = document.getElementById('payam-main-container');
            const payamContainer = document.getElementById('payam-container');
            const buttonContainer = document.getElementById('button-container');
            const gifs = [
                document.getElementById('gif1'),
                document.getElementById('gif2'),
                document.getElementById('gif3'),
                document.getElementById('gif4')
            ];
            let gifIndex = 0;
            let timeoutIds = [];
        
            function startScenario() {
                // پاکسازی کامل
                timeoutIds.forEach(id => clearTimeout(id));
                timeoutIds = [];
                klikkonContainer.classList.remove('hidden');
                pakatebazContainer.classList.add('hidden');
                payamMainContainer.classList.add('hidden');
                buttonContainer.classList.add('hidden');
                gifs.forEach(gif => gif.classList.add('hidden'));
                payamContainer.classList.remove('fade-out-effect');
                klikkonImg.classList.remove('clicked');
                pakatebazImg.classList.remove('shrink-out');

                // تنظیم مجدد انیمیشن‌های CSS
                void klikkonContainer.offsetWidth;
                void pakatebazContainer.offsetWidth;
                void payamMainContainer.offsetWidth;
                
                klikkonImg.style.cursor = 'pointer';
                klikkonImg.removeEventListener('click', handleKlikkonClick);
                klikkonImg.addEventListener('click', handleKlikkonClick, { once: true });
            }
        
            function handleKlikkonClick() {
                klikkonImg.style.cursor = 'default';
                klikkonImg.classList.add('clicked');
                
                timeoutIds.push(setTimeout(() => {
                    klikkonContainer.classList.add('hidden');
                    
                    pakatebazContainer.classList.remove('hidden');
        
                    timeoutIds.push(setTimeout(() => {
                        pakatebazImg.classList.add('shrink-out');
                        
                        timeoutIds.push(setTimeout(() => {
                            pakatebazContainer.classList.add('hidden');
                            
                            payamMainContainer.classList.remove('hidden');
        
                            // شروع نمایش گیف‌ها بعد از 30 ثانیه
                            timeoutIds.push(setTimeout(showGifs, 30000));
        
                        }, 1000)); 
                    }, 2000)); 
                }, 1000));
            }
            
            function showGifs() {
                if (gifIndex < gifs.length) {
                    if (gifIndex > 0) {
                        gifs[gifIndex - 1].classList.add('hidden');
                    }
                    
                    gifs[gifIndex].classList.remove('hidden');
                    
                    gifIndex++;
                    timeoutIds.push(setTimeout(showGifs, 8000));
                } else {
                    if (gifs.length > 0) {
                        gifs[gifs.length - 1].classList.add('hidden');
                    }
                    
                    payamContainer.classList.add('fade-out-effect');
                    
                    timeoutIds.push(setTimeout(() => {
                        payamMainContainer.classList.add('hidden');
                        buttonContainer.classList.remove('hidden');
                    }, 1000));

                    document.getElementById('restart-btn').addEventListener('click', () => {
                        startScenario();
                    });
        
                    document.getElementById('back-to-form-btn').addEventListener('click', () => {
                        window.location.href = 'URL_Form_Page'; 
                    });
                }
            }
        
            startScenario();
        });
    </script>
</body>
</html>
