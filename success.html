<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه تبریک</title>
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            color: white;
            background-color: #000;
        }
        
        /* انیمیشن چرخش سه بعدی برای پس‌زمینه */
        @keyframes gold-gradient-rotate {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }
        
        .gold-background {
            background: linear-gradient(-45deg, #FFD700, #FFCC00, #FFEB00, #FFF200);
            background-size: 400% 400%;
            animation: gold-gradient-rotate 20s ease infinite;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            cursor: pointer;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            position: absolute;
        }

        /* انیمیشن محو شدن (Fade-out) */
        .fade-out {
            animation: fadeOut 0.5s forwards;
        }
        
        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.8); }
        }
        
        /* انیمیشن وارد شدن (Fade-in) */
        .image-fade-in {
            animation: fadeIn 0.5s forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* انیمیشن Bounce (برای تصویر پیام) و افکت برجسته */
        .bounce-effect {
            animation: bounceIn 0.8s forwards;
            position: relative;
            transform: perspective(1000px) rotateX(0deg);
        }

        .payam-3d {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 6px 6px rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            transform: rotateY(10deg) rotateX(5deg) scale(1.05);
            transition: transform 0.5s ease;
        }
        .payam-3d:hover {
            transform: rotateY(0deg) rotateX(0deg) scale(1);
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: perspective(1000px) scale(0.3) rotateX(90deg); }
            50% { opacity: 1; transform: perspective(1000px) scale(1.1) rotateX(-10deg); }
            70% { transform: perspective(1000px) scale(0.9) rotateX(5deg); }
            100% { transform: perspective(1000px) scale(1) rotateX(0deg); }
        }

        /* استایل کانتینر پیام و گیف‌ها */
        #payam-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #payam {
            max-width: 90%;
            max-height: 90vh;
            position: absolute;
        }

        #gif-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .gif {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        #gif1 {
            bottom: 5vh;
        }
        
        /* استایل دکمه‌ها */
        #button-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: absolute;
            bottom: 20px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            transform: perspective(1000px) rotateX(0deg);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: perspective(1000px) rotateX(5deg) scale(1.05);
        }

        .blue-button {
            background: linear-gradient(145deg, #007bff, #0056b3);
            box-shadow: 0 7px 0 #003366, 0 8px 15px rgba(0, 0, 0, 0.4);
        }
        .blue-button:active {
            box-shadow: 0 2px 0 #003366, 0 3px 6px rgba(0, 0, 0, 0.4);
            transform: translateY(5px);
        }

        .green-button {
            background: linear-gradient(145deg, #28a745, #1e7e34);
            box-shadow: 0 7px 0 #145224, 0 8px 15px rgba(0, 0, 0, 0.4);
        }
        .green-button:active {
            box-shadow: 0 2px 0 #145224, 0 3px 6px rgba(0, 0, 0, 0.4);
            transform: translateY(5px);
        }
    </style>
</head>
<body>

    <div id="container">
        <img id="klikkon" class="image-fade-in" src="klikkon.png" alt="کلیک کنید">
        <img id="pakatebaz" class="hidden" src="pakatebaz.png" alt="پاکت باز">
        
        <div id="payam-container" class="hidden">
            <img id="payam" src="payam.png" alt="پیام">
            <div id="gif-container">
                <img id="gif1" class="hidden gif" src="1.gif" alt="گیف 1">
                <img id="gif2" class="hidden gif" src="2.gif" alt="گیف 2">
                <img id="gif3" class="hidden gif" src="3.gif" alt="گیف 3">
                <img id="gif4" class="hidden gif" src="4.gif" alt="گیف 4">
            </div>
        </div>
    </div>
    
    <div id="button-container" class="hidden">
        <button id="restart-btn" class="green-button">شروع مجدد</button>
        <button id="back-to-form-btn" class="blue-button">بازگشت به فرم</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const klikkonImg = document.getElementById('klikkon');
            const pakatebazImg = document.getElementById('pakatebaz');
            const payamContainer = document.getElementById('payam-container');
            const payamImg = document.getElementById('payam');
            const buttonContainer = document.getElementById('button-container');
            const gifs = [
                document.getElementById('gif1'),
                document.getElementById('gif2'),
                document.getElementById('gif3'),
                document.getElementById('gif4')
            ];
            let gifIndex = 0;
            let gifInterval;
        
            function startScenario() {
                // پاک کردن تمام کلاس‌ها و تایمرها
                clearTimeout(gifInterval);
                klikkonImg.classList.remove('hidden', 'fade-out');
                pakatebazImg.classList.add('hidden', 'fade-out');
                payamContainer.classList.add('hidden');
                buttonContainer.classList.add('hidden');
                document.body.classList.remove('gold-background');
                gifs.forEach(gif => gif.classList.add('hidden'));
                payamImg.classList.remove('bounce-effect', 'payam-3d');
                klikkonImg.style.cursor = 'pointer';

                // افزودن event listener فقط برای klikkon
                klikkonImg.removeEventListener('click', handleKlikkonClick); // برای جلوگیری از اضافه شدن چندین بار
                klikkonImg.addEventListener('click', handleKlikkonClick, { once: true });
            }
        
            function handleKlikkonClick() {
                klikkonImg.style.cursor = 'default';
                klikkonImg.classList.add('fade-out');
                
                setTimeout(() => {
                    klikkonImg.classList.add('hidden');
                    
                    pakatebazImg.classList.remove('hidden');
                    pakatebazImg.classList.add('image-fade-in');
        
                    setTimeout(() => {
                        pakatebazImg.classList.add('fade-out');
                        
                        setTimeout(() => {
                            pakatebazImg.classList.add('hidden');
                            
                            payamContainer.classList.remove('hidden');
                            payamImg.classList.add('bounce-effect', 'payam-3d');
                            document.body.classList.add('gold-background');
        
                            // شروع نمایش گیف‌ها بعد از 40 ثانیه
                            setTimeout(showGifs, 40000); 
        
                        }, 2000); 
                    }, 2000); 
                }, 2000);
            }
            
            function showGifs() {
                if (gifIndex < gifs.length) {
                    if (gifIndex > 0) {
                        gifs[gifIndex - 1].classList.add('hidden');
                    }
                    
                    gifs[gifIndex].classList.remove('hidden');
                    
                    gifIndex++;
                    gifInterval = setTimeout(showGifs, 15000);
                } else {
                    if (gifs.length > 0) {
                        gifs[gifs.length - 1].classList.add('hidden');
                    }
                    
                    buttonContainer.classList.remove('hidden');
                    
                    document.getElementById('restart-btn').addEventListener('click', () => {
                        gifIndex = 0; 
                        startScenario();
                    });
        
                    document.getElementById('back-to-form-btn').addEventListener('click', () => {
                        window.location.href = 'URL_Form_Page'; 
                    });
                }
            }
        
            startScenario();
        });
    </script>
</body>
</html>
