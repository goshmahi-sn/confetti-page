<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه تبریک</title>
    
    <style>
        @import url('https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css');

        :root {
            --gold-start: #DAA520; /* Goldenrod for deeper gold */
            --gold-end: #FFD700;   /* Gold */
            --pulse-color: #DAA520;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Vazir', sans-serif;
            color: #000;
            background-color: #000;
            transition: background-color 1s ease-in-out;
        }
        
        @keyframes gold-gradient-rotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .white-background {
            background-color: #ffffff;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            cursor: pointer;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            position: absolute;
        }

        /* Enhanced Animation Keyframes */
        @keyframes fadeInScaleUp {
            from { opacity: 0; transform: scale(0.8) rotate(5deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes fadeOutScaleDown {
            from { opacity: 1; transform: scale(1) rotate(0deg); }
            to { opacity: 0; transform: scale(0.8) rotate(-5deg); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: perspective(1000px) scale(0.3) rotateX(90deg) rotateY(10deg); }
            60% { opacity: 1; transform: perspective(1000px) scale(1.2) rotateX(-15deg) rotateY(-5deg); }
            80% { transform: perspective(1000px) scale(0.9) rotateX(10deg) rotateY(3deg); }
            100% { transform: perspective(1000px) scale(1) rotateX(0deg) rotateY(0deg); }
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(218, 165, 32, 0.5), 0 0 30px rgba(218, 165, 32, 0.5), 0 0 45px rgba(218, 165, 32, 0.3);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 30px var(--pulse-color), 0 0 60px var(--pulse-color), 0 0 90px var(--pulse-color), 0 0 120px var(--pulse-color);
            }
        }
        
        @keyframes gif-slide-in-up {
            from { transform: translateY(50px) rotate(5deg); opacity: 0; }
            to { transform: translateY(0) rotate(0deg); opacity: 1; }
        }

        @keyframes gif-slide-out-down {
            from { transform: translateY(0) rotate(0deg); opacity: 1; }
            to { transform: translateY(50px) rotate(-5deg); opacity: 0; }
        }

        @keyframes buttonHoverPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 7px 0 #145224, 0 8px 15px rgba(0, 0, 0, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 10px 0 #145224, 0 12px 20px rgba(0, 0, 0, 0.5); }
        }

        /* Applying Animations */
        .image-fade-in { animation: fadeInScaleUp 0.5s forwards; }
        .fade-out { animation: fadeOutScaleDown 0.5s forwards; }
        .bounce-in-effect { animation: bounceIn 0.6s forwards; }
        .pulse-glow-effect { animation: pulseGlow 1.5s ease-in-out infinite; }
        
        #payam-container {
            position: relative;
            width: 100%;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #payam {
            max-width: 90%;
            max-height: 60vh;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            background: linear-gradient(-45deg, var(--gold-start), var(--gold-end), var(--gold-start));
            background-size: 600% 600%;
            animation: gold-gradient-rotate 15s ease infinite;
            padding: 15px;
            position: relative;
        }

        #gif-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 1;
        }
        
        #gif-container-1 {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 0; /* Stuck directly below payam */
            pointer-events: none;
        }

        .gif {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            animation: gif-slide-in-up 0.6s forwards;
        }

        .gif.fade-out {
            animation: gif-slide-out-down 0.6s forwards;
        }

        #button-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeInScaleUp 0.8s forwards;
            animation-delay: 0.8s;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
            animation: buttonHoverPulse 2s infinite ease-in-out;
        }
        
        button:hover {
            transform: translateY(-3px) rotateX(8deg) scale(1.05);
            box-shadow: 0 10px 0 #003366, 0 12px 20px rgba(0, 0, 0, 0.5);
        }

        .blue-button {
            background: linear-gradient(145deg, #007bff, #0056b3);
            box-shadow: 0 7px 0 #003366, 0 8px 15px rgba(0, 0, 0, 0.4);
        }
        .blue-button:active {
            background: #0056b3;
            box-shadow: 0 2px 0 #003366, 0 3px 6px rgba(0, 0, 0, 0.4);
            transform: translateY(5px);
        }

        .green-button {
            background: linear-gradient(145deg, #28a745, #1e7e34);
            box-shadow: 0 7px 0 #145224, 0 8px 15px rgba(0, 0, 0, 0.4);
        }
        .green-button:active {
            background: #1e7e34;
            box-shadow: 0 2px 0 #145224, 0 3px 6px rgba(0, 0, 0, 0.4);
            transform: translateY(5px);
        }

        @media (max-width: 768px) {
            #payam {
                max-height: 50vh;
            }
            button {
                padding: 10px 20px;
                font-size: 1rem;
            }
            .gif {
                max-width: 70%;
                max-height: 70%;
            }
        }

        @media (max-width: 480px) {
            #payam {
                max-height: 40vh;
            }
            button {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
            .gif {
                max-width: 60%;
                max-height: 60%;
            }
        }
    </style>
</head>
<body>

    <div id="container">
        <img id="klikkon" class="image-fade-in" src="klikkon.png" alt="کلیک کنید">
        <img id="pakatebaz" class="hidden" src="pakatebaz.png" alt="پاکت باز">
        
        <div id="payam-container" class="hidden">
            <img id="payam" src="payam.png" alt="پیام">
            
            <div id="gif-container">
                <img id="gif2" class="hidden gif" src="2.gif" alt="گیف 2">
                <img id="gif3" class="hidden gif" src="3.gif" alt="گیف 3">
                <img id="gif4" class="hidden gif" src="4.gif" alt="گیف 4">
            </div>

            <div id="gif-container-1" class="hidden">
                <img id="gif1" class="hidden gif" src="1.gif" alt="گیف 1">
            </div>

            <div id="button-container" class="hidden">
                <button id="restart-btn" class="green-button">شروع مجدد</button>
                <button id="back-to-form-btn" class="blue-button">بازگشت به فرم</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const klikkonImg = document.getElementById('klikkon');
            const pakatebazImg = document.getElementById('pakatebaz');
            const payamContainer = document.getElementById('payam-container');
            const payamImg = document.getElementById('payam');
            const buttonContainer = document.getElementById('button-container');
            const gif1Container = document.getElementById('gif-container-1');
            const gifs = [
                document.getElementById('gif1'),
                document.getElementById('gif2'),
                document.getElementById('gif3'),
                document.getElementById('gif4')
            ];
            
            let gifIndex = 0;
            let gifInterval;
            let payamTimeout;

            function startScenario() {
                clearTimeout(gifInterval);
                clearTimeout(payamTimeout);
                
                klikkonImg.classList.remove('hidden', 'fade-out', 'image-fade-in');
                klikkonImg.classList.add('image-fade-in');
                pakatebazImg.classList.add('hidden');
                payamContainer.classList.add('hidden');
                buttonContainer.classList.add('hidden');
                gif1Container.classList.add('hidden');
                document.body.classList.remove('white-background');
                payamImg.classList.remove('pulse-glow-effect');

                gifs.forEach(gif => {
                    gif.classList.add('hidden');
                    gif.style.top = '';
                    gif.style.left = '';
                });

                klikkonImg.style.cursor = 'pointer';
                klikkonImg.removeEventListener('click', handleKlikkonClick);
                klikkonImg.addEventListener('click', handleKlikkonClick, { once: true });
            }

            function handleKlikkonClick() {
                klikkonImg.style.cursor = 'default';
                klikkonImg.classList.add('fade-out');
                
                setTimeout(() => {
                    klikkonImg.classList.add('hidden');
                    pakatebazImg.classList.remove('hidden');
                    pakatebazImg.classList.add('image-fade-in');
        
                    setTimeout(() => {
                        pakatebazImg.classList.add('fade-out');
                        
                        setTimeout(() => {
                            pakatebazImg.classList.add('hidden');
                            document.body.classList.add('white-background');
                            
                            payamContainer.classList.remove('hidden');
                            payamImg.classList.add('bounce-in-effect');
        
                            payamTimeout = setTimeout(() => {
                                payamImg.classList.add('pulse-glow-effect');
                                showGifs();
                            }, 30000); 
        
                        }, 500); 
                    }, 500); 
                }, 500);
            }
            
            function showGifs() {
                if (gifIndex < gifs.length) {
                    if (gifIndex > 0) {
                        gifs[gifIndex - 1].classList.add('fade-out');
                        setTimeout(() => {
                             gifs[gifIndex - 1].classList.add('hidden');
                             gifs[gifIndex - 1].classList.remove('fade-out');
                        }, 600);
                    }
                    
                    const currentGif = gifs[gifIndex];
                    currentGif.classList.remove('hidden');
                    
                    if (gifIndex === 0) { // GIF 1
                        gif1Container.classList.remove('hidden');
                    } else { // GIFs 2, 3, 4
                        const payamRect = payamImg.getBoundingClientRect();
                        const randomTop = Math.random() * (payamRect.height * 0.7) + (payamRect.height * 0.15);
                        const randomLeft = Math.random() * (payamRect.width * 0.7) + (payamRect.width * 0.15);
                        
                        currentGif.style.position = 'absolute';
                        currentGif.style.top = `${randomTop}px`;
                        currentGif.style.left = `${randomLeft}px`;
                    }
                    
                    gifIndex++;
                    gifInterval = setTimeout(showGifs, 6000);
                } else {
                    if (gifs.length > 0) {
                        gifs[gifs.length - 1].classList.add('fade-out');
                        setTimeout(() => {
                            gifs[gifs.length - 1].classList.add('hidden');
                            gifs[gifs.length - 1].classList.remove('fade-out');
                        }, 600);
                    }
                    
                    buttonContainer.classList.remove('hidden');
                    payamImg.classList.remove('pulse-glow-effect');
                    payamImg.classList.remove('bounce-in-effect');
                    
                    document.getElementById('restart-btn').removeEventListener('click', restartHandler);
                    document.getElementById('restart-btn').addEventListener('click', restartHandler);

                    document.getElementById('back-to-form-btn').removeEventListener('click', backToFormHandler);
                    document.getElementById('back-to-form-btn').addEventListener('click', backToFormHandler);
                }
            }

            const restartHandler = () => {
                gifIndex = 0; 
                startScenario();
            };

            const backToFormHandler = () => {
                window.location.href = 'URL_Form_Page'; 
            };
        
            startScenario();
        });
    </script>
</body>
</html>
