<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید اصالت کالا</title>
    <style>
        /* keyframes برای انیمیشن‌ها */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        @keyframes slideInUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* استایل‌های کلی */
        body {
            font-family: 'B Nazanin', 'Vazirmatn', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        
        /* استایل برای تمام تصاویر در صفحه */
        .image {
            width: 80%;
            max-width: 400px;
            cursor: pointer;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease-in-out;
        }

        /* استایل برای گیف‌های تمام صفحه */
        .confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            z-index: 10;
        }
        .confetti.visible {
            opacity: 1;
        }

        /* استایل برای کانتینر پیام با پس‌زمینه سه بعدی */
        #message-container {
            position: relative;
            display: none;
            padding: 20px;
            width: 80%;
            max-width: 400px;
            border-radius: 15px;
            background-color: #f0c058; /* رنگ طلایی */
            border: 2px solid #a3895a;
            box-shadow: 0 5px #8c7847, 0 10px 20px rgba(0, 0, 0, 0.2);
            z-index: 20;
        }
        #message-image {
            width: 100%;
            height: auto;
        }
        
        .button-link {
            display: none;
            margin-top: 30px;
            text-decoration: none;
            z-index: 30;
        }

        .back-button {
            padding: 15px 40px;
            border-radius: 25px;
            background-color: #17a2b8;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            box-shadow: 0 5px #0e6c7c;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .back-button:active {
            box-shadow: 0 2px #0e6c7c;
            transform: translateY(3px);
        }
    </style>
</head>
<body>

    <img id="klik-kon" src="Klik kon.png" alt="پاکت نامه بسته" class="image">
    <img id="pakatebaz" src="pakatebaz.png" alt="پاکت نامه باز" class="image" style="display: none;">
    
    <div id="message-container">
        <img id="payam-image" src="payam.png" alt="متن تایید اصالت کالا">
    </div>

    <img id="confetti-1" src="1.gif" alt="کاغذ رنگی" class="confetti">
    <img id="confetti-2" src="2.gif" alt="کاغذ رنگی" class="confetti">
    <img id="confetti-3" src="3.gif" alt="کاغذ رنگی" class="confetti">
    <img id="confetti-4" src="4.gif" alt="کاغذ رنگی" class="confetti">

    <a href="https://docs.google.com/forms/d/e/1FAIpQLScJzM5F8R9-..." id="back-button-link" class="button-link">
        <button class="back-button">بازگشت به فرم</button>
    </a>

    <script>
        const klikKon = document.getElementById('klik-kon');
        const pakatebaz = document.getElementById('pakatebaz');
        const messageContainer = document.getElementById('message-container');
        const backButtonLink = document.getElementById('back-button-link');
        const confettiGifs = [
            document.getElementById('confetti-1'),
            document.getElementById('confetti-2'),
            document.getElementById('confetti-3'),
            document.getElementById('confetti-4')
        ];

        // مدت زمان تقریبی هر انیمیشن بر حسب میلی‌ثانیه
        const gifDurations = [1500, 1500, 1500, 1500]; // زمان را بر اساس طول واقعی گیف‌ها تنظیم کنید

        klikKon.addEventListener('click', () => {
            // انیمیشن محو شدن klik kon و ظاهر شدن pakatebaz
            klikKon.style.animation = 'fadeOut 0.5s forwards';
            
            setTimeout(() => {
                klikKon.style.display = 'none';
                pakatebaz.style.display = 'block';
                pakatebaz.style.animation = 'fadeIn 0.5s forwards';

                // تأخیر 2 ثانیه‌ای پس از نمایش pakatebaz
                setTimeout(() => {
                    pakatebaz.style.animation = 'fadeOut 0.5s forwards';
                    
                    // نمایش پیام با انیمیشن
                    setTimeout(() => {
                        pakatebaz.style.display = 'none';
                        messageContainer.style.display = 'flex';
                        messageContainer.style.animation = 'slideInUp 0.5s forwards, fadeIn 0.5s forwards';
                        
                        let delay = 500; // تأخیر اولیه برای گیف‌ها

                        // نمایش گیف‌ها به ترتیب
                        confettiGifs.forEach((gif, index) => {
                            setTimeout(() => {
                                gif.classList.add('visible');
                                setTimeout(() => {
                                    gif.classList.remove('visible');
                                }, gifDurations[index]);
                            }, delay);
                            delay += gifDurations[index];
                        });

                        // نمایش دکمه پس از اتمام تمام انیمیشن‌ها
                        setTimeout(() => {
                            backButtonLink.style.display = 'block';
                        }, delay + 500);
                    }, 500); // تأخیر 0.5 ثانیه برای نمایش پیام
                }, 2000); // 2 ثانیه تأخیر پس از نمایش pakatebaz
            }, 500); // 0.5 ثانیه تأخیر برای محو شدن Klik kon
        });
    </script>
</body>
</html>
