<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید اصالت کالا</title>
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        @keyframes openEnvelope {
            from { transform: scale(1) rotateY(0deg); opacity: 1; }
            to { transform: scale(0.8) rotateY(90deg); opacity: 0; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes oldTvEffect {
            0% { filter: contrast(1) brightness(1) saturate(1) blur(0px); transform: scale(1); opacity: 1; }
            50% { filter: contrast(1.5) brightness(0.5) saturate(2) blur(2px); transform: scale(1.1); opacity: 0.5; }
            100% { filter: contrast(0) brightness(0) saturate(0) blur(5px); transform: scale(0.5); opacity: 0; }
        }
        
        body {
            font-family: 'Vazirmatn', 'B Nazanin', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        
        #text-klikon {
            font-size: 2.5em;
            font-weight: bold;
            color: #4CAF50;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        #text-klikon:hover {
            transform: scale(1.05);
        }

        .image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .clickable-image {
            width: 80%;
            max-width: 400px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
            display: none;
        }

        #open-envelope {
            display: none;
        }

        #message-image-container {
            display: none;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            background-color: #d1b87b; /* طلایی ملایم */
            border: 2px solid #a38c64;
            border-top: 2px solid #ffde94;
            border-left: 2px solid #ffde94;
            box-shadow: 
                inset -1px -1px #a38c64, 
                inset 1px 1px #ffde94,
                -3px -3px 10px rgba(0,0,0,0.2),
                3px 3px 10px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
        }

        #message-image {
            width: 100%;
            height: auto;
        }

        .confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
        }

        .confetti.visible {
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }
        
        .button-link {
            display: none;
            margin-top: 40px;
            text-decoration: none;
            position: relative;
            z-index: 10;
        }

        .back-button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: #2173ff; /* آبی ویندوز XP */
            color: white;
            border: 2px solid #144b9b;
            border-top: 2px solid #6699ff;
            border-left: 2px solid #6699ff;
            box-shadow: 
                inset -1px -1px #144b9b,
                inset 1px 1px #6699ff;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            transition: all 0.1s;
        }
        
        .back-button:active {
            transform: translateY(2px);
            border: 2px solid #6699ff;
            border-top: 2px solid #144b9b;
            border-left: 2px solid #144b9b;
            box-shadow: 
                inset -1px -1px #6699ff,
                inset 1px 1px #144b9b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="text-klikon">پاکت نامه بسته</h1>
        <div class="image-container">
            <img id="open-envelope" class="clickable-image" src="pakatebaz.png" alt="پاکت نامه باز">
        </div>

        <div id="message-image-container">
            <img id="message-image" src="payam.png" alt="متن تایید اصالت کالا">
        </div>
    </div>
    
    <img id="confetti-1" src="1.gif" alt="کاغذ رنگی" class="confetti">
    <img id="confetti-2" src="2.gif" alt="کاغذ رنگی" class="confetti">
    <img id="confetti-3" src="3.gif" alt="کاغذ رنگی" class="confetti">
    <img id="confetti-4" src="4.gif" alt="کاغذ رنگی" class="confetti">

    <a href="https://docs.google.com/forms/d/e/1FAIpQLScJzM5F8R9-..." id="back-button-link" class="button-link">
        <button class="back-button">بازگشت به فرم</button>
    </a>

    <script>
        const textKlikon = document.getElementById('text-klikon');
        const openEnvelope = document.getElementById('open-envelope');
        const messageContainer = document.getElementById('message-image-container');
        const messageImage = document.getElementById('message-image');
        const backButtonLink = document.getElementById('back-button-link');
        const confettiGifs = [
            document.getElementById('confetti-1'),
            document.getElementById('confetti-2'),
            document.getElementById('confetti-3'),
            document.getElementById('confetti-4')
        ];

        textKlikon.addEventListener('click', () => {
            textKlikon.style.animation = 'openEnvelope 0.5s forwards';

            setTimeout(() => {
                textKlikon.style.display = 'none';
                openEnvelope.style.display = 'block';
                
                setTimeout(() => {
                    openEnvelope.style.display = 'none';
                    messageContainer.style.display = 'block';
                    messageImage.style.animation = 'bounceIn 1s forwards';
                    confettiGifs.forEach(gif => gif.classList.add('visible'));
                    
                    setTimeout(() => {
                        messageImage.style.animation = 'oldTvEffect 1s forwards';
                        confettiGifs.forEach(gif => gif.classList.remove('visible'));

                        setTimeout(() => {
                            messageContainer.style.display = 'none';
                            backButtonLink.style.display = 'block';
                        }, 1000); 

                    }, 7000); 

                }, 2000); 

            }, 500);
        });

    </script>
</body>
</html>
