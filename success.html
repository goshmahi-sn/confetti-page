<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید اصالت کالا</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body {
            font-family: 'B Nazanin', 'Vazirmatn', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .full-screen-image {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* برای قرار گرفتن در پس زمینه */
        }
        
        .confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            z-index: 2; /* برای نمایش روی پس زمینه */
        }
        
        .confetti.visible {
            animation: fadeIn 0.5s forwards;
        }

        .content {
            position: relative;
            z-index: 3; /* برای قرار گرفتن روی انیمیشن و پس زمینه */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 90%;
            max-width: 600px;
            padding: 20px;
        }
        
        #closed-envelope {
            width: 80%;
            max-width: 400px;
            cursor: pointer;
            transition: opacity 0.5s ease-in-out;
        }

        #message-container {
            position: relative;
            display: none;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2); /* سایه سه بعدی */
            animation: fadeIn 0.5s forwards;
        }
        
        #message-image {
            width: 100%;
            height: auto;
        }
        
        .button-link {
            display: none;
            margin-top: 30px;
            text-decoration: none;
        }

        .back-button {
            padding: 15px 40px;
            border-radius: 25px;
            background-color: #17a2b8; /* رنگ اطلسی */
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            box-shadow: 0 5px #0e6c7c; /* سایه برای حالت سه بعدی */
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .back-button:active {
            box-shadow: 0 2px #0e6c7c;
            transform: translateY(3px);
        }
    </style>
</head>
<body>

    <img id="closed-envelope" src="klikon.png" alt="پاکت نامه بسته">

    <div id="message-container">
        <img id="message-image" src="payam.png" alt="متن تایید اصالت کالا">
    </div>

    <img id="confetti-1" src="1.gif" alt="کاغذ رنگی" class="confetti">
    <img id="confetti-2" src="2.gif" alt="کاغذ رنگی" class="confetti">
    <img id="confetti-3" src="3.gif" alt="کاغذ رنگی" class="confetti">
    <img id="confetti-4" src="4.gif" alt="کاغذ رنگی" class="confetti">

    <a href="https://docs.google.com/forms/d/e/1FAIpQLScJzM5F8R9-..." id="back-button-link" class="button-link">
        <button class="back-button">بازگشت به فرم</button>
    </a>

    <script>
        const closedEnvelope = document.getElementById('closed-envelope');
        const messageContainer = document.getElementById('message-container');
        const backButtonLink = document.getElementById('back-button-link');
        const confettiGifs = [
            document.getElementById('confetti-1'),
            document.getElementById('confetti-2'),
            document.getElementById('confetti-3'),
            document.getElementById('confetti-4')
        ];

        closedEnvelope.addEventListener('click', () => {
            // مخفی کردن پاکت نامه بسته
            closedEnvelope.style.display = 'none';

            // نمایش پیام با انیمیشن
            messageContainer.style.display = 'flex';
            
            // نمایش GIFها به ترتیب و با تأخیر
            setTimeout(() => {
                confettiGifs[0].classList.add('visible'); // نمایش گیف اول
                setTimeout(() => {
                    confettiGifs[0].classList.remove('visible');
                    confettiGifs[1].classList.add('visible'); // نمایش گیف دوم
                    setTimeout(() => {
                        confettiGifs[1].classList.remove('visible');
                        confettiGifs[2].classList.add('visible'); // نمایش گیف سوم
                        setTimeout(() => {
                            confettiGifs[2].classList.remove('visible');
                            confettiGifs[3].classList.add('visible'); // نمایش گیف چهارم
                            setTimeout(() => {
                                confettiGifs[3].classList.remove('visible');
                                backButtonLink.style.display = 'block'; // نمایش دکمه
                            }, 1000); // 1 ثانیه پس از گیف آخر
                        }, 1000); // 1 ثانیه پس از گیف سوم
                    }, 1000); // 1 ثانیه پس از گیف دوم
                }, 1000); // 1 ثانیه پس از گیف اول
            }, 500); // 0.5 ثانیه پس از کلیک
        });

    </script>
</body>
</html>
